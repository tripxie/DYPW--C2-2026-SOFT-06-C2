<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>

    <link rel="stylesheet" href="css/registro-usuario.css">
</head>

<body>

    <main>
        <header>
            <h1>Registro de usuario</h1>
            <p>Complete todos los campos obligatorios para crear su cuenta.</p>
        </header>

        <form action="" novalidate>
            <div>
                <label for="nombre-usuario">Nombre completo</label>
                <span aria-hidden="true">*</span>

                <div>
                    <input type="text" id="nombre-usuario" placeholder="ej. María Pérez" required aria-required="true" aria-describedby="ayuda-nombre">

                    <span id="ayuda-nombre" class="texto-oculto">Ingrese su nombre completo (mínimo 5 caracteres).</span>
                </div>
            </div>

            <!-- Correo -->
             <div>
                <label for="correo">Correo</label>
                <span aria-hidden="true">*</span>

                <div>
                    <input type="email" id="correo" placeholder="usuario@dominio.com" required aria-required="true" aria-describedby="ayuda-correo">

                    <span id="ayuda-correo" class="texto-oculto">Ingrese su un correo válido (ej. usuario@dominio.com).</span>
                </div>
            </div>

            <!-- Contraseña -->
             <div>
                <label for="contrasenna">Contraseña</label>
                <span aria-hidden="true">*</span>

                <div>
                    <input type="password" id="contrasenna" required aria-required="true">
                </div> 

            </div>

            <!-- Verificación de la contraseña -->
             <!-- Contraseña -->
             <div>
                <label for="verificacion-contrasenna">Confirmar contraseña</label>
                <span aria-hidden="true">*</span>

                <div>
                    <input type="password" id="verificacion-contrasenna" required aria-required="true" aria-describedby="ayuda-confirmacion-contrasenna">

                    <span id="ayuda-confirmacion-contrasenna" class="texto-oculto">Vuelva a escribir la misma contraseña.</span>
                </div> 

            </div>

            <button>Crear cuenta</button>


        </form>
    </main>




</body>

</html>
